book:
  title: "CD2030 Datasuite Vaxx App Guide"
  search:
    type: textbox

  page-footer: 
    right: |
      This guide was built with <a href="https://quarto.org/">Quarto</a>.
  site-url: https://aphrcwaro.github.io/vaxx_guide/
  repo-url: https://github.com/aphrcwaro/vaxx_guide/
  repo-branch: main
  repo-actions: [edit, issue]
  
  date: today
  date-format: "MMM D, YYYY"
  
  chapters:

    - index.qmd
    
    - part: About this Guide
      part-fr: À propos de ce guide
      part-pt: Sobre este Guia
      chapters:
        - pages/general-intro.qmd
        - pages/getting-started.qmd
        - pages/app-features.qmd
        - pages/loading-data.qmd

    - part: Data Quality Assessment
      part-fr: Évaluation de la qualité des données
      part-pt: Avaliação da Qualidade dos Dados
      chapters:
        - pages/numerator-assessment.qmd
        - pages/numerator-adjustments.qmd
        - pages/denominator-assessment.qmd

    - part: National Analyses
      part-fr: Analyses Nationales
      part-pt: Análises Nacionais
      chapters:
        - pages/national-coverage.qmd
        - pages/national-inequality.qmd
        - pages/national-global-coverage.qmd
        - pages/national-subnational-mapping.qmd
        - pages/national-equity-assessment.qmd

    - part: Sub-national Analyses
      part-fr: Analyses infranationales
      part-pt: Análises Subnacionais
      chapters:
        - pages/subnational-coverage.qmd
        - pages/subnational-inequality.qmd
        - pages/subnational-global-coverage.qmd

